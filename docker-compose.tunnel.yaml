name: uptimekuma
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: louislam/uptime-kuma:2
    container_name: uptimekuma-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: uptimekuma-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/data/uptimekuma:/app/data:z'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://uptimekuma-app:3001'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - uptimekuma
      - cloudflare

networks:
  uptimekuma:
    name: uptimekuma
    external: false
  cloudflare:
    external: true
