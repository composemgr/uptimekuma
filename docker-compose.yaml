# nginx proxy address - http://172.17.0.1:64379

name: uptimekuma
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: louislam/uptime-kuma:2
    container_name: uptimekuma-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: uptimekuma-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD-SHELL', 'extra/healthcheck']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64379:3001'
    volumes:
      - './volumes/data/uptimekuma:/app/data:z'
    networks:
      - uptimekuma

networks:
  uptimekuma:
    name: uptimekuma
    external: false
